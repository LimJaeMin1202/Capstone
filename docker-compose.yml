# CareFit — Docker Compose 배포 구성
# 사용법:
#   1) .env.example 을 .env로 복사하고 값 채우기
#   2) docker compose up -d --build
#
# 서비스:
#   - postgres : DB
#   - backend  : Spring Boot (8080)
#   - frontend : nginx + 정적 파일 (80, /api는 backend로 프록시)

services:
  postgres:
    image: postgres:16-alpine
    container_name: carefit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d capstone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carefit-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-12003}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/capstone
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALIDITY_MS: ${JWT_VALIDITY_MS:-86400000}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      DB_BASELINE_ON_MIGRATE: ${DB_BASELINE_ON_MIGRATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KAKAO_REST_API_KEY: ${VITE_KAKAO_REST_API_KEY}
        VITE_KAKAO_REDIRECT_URI: ${VITE_KAKAO_REDIRECT_URI}
        VITE_BASE_PATH: ${APP_BASE_PATH:-/}
        VITE_API_BASE: ${VITE_API_BASE:-/}
    container_name: carefit-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-12002}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
