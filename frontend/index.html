<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>재활 운동 자세 피드백</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: white; font-family: sans-serif; min-height: 100vh; }

    /* 네비게이션 */
    #nav {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      background: #16213e; padding: 12px 24px;
      justify-content: space-between; align-items: center;
      z-index: 100; border-bottom: 1px solid #0f3460;
    }
    #nav.visible { display: flex; }
    #nav .logo { font-weight: bold; font-size: 1rem; }
    #nav .tabs { display: flex; gap: 8px; }
    #nav .tabs button {
      background: none; border: 1px solid #444; color: #aaa;
      padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
    }
    #nav .tabs button.active { border-color: #00e5ff; color: #00e5ff; }

    /* 공통 화면 */
    .screen { display: none; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
    .screen.active { display: flex; }

    /* 운동 선택 화면 */
    #select-screen { justify-content: center; }
    #select-screen h1 { font-size: 1.8rem; margin-bottom: 8px; }
    #select-screen p { color: #aaa; margin-bottom: 40px; }
    .exercise-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 700px; width: 100%; }
    .exercise-card {
      background: #16213e; border: 2px solid #0f3460;
      border-radius: 16px; padding: 28px 16px; text-align: center;
      cursor: pointer; transition: all 0.2s;
    }
    .exercise-card:hover { border-color: #00e5ff; transform: translateY(-4px); background: #0f3460; }
    .exercise-card .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .exercise-card .name { font-size: 1rem; font-weight: bold; margin-bottom: 6px; }
    .exercise-card .desc { font-size: 0.8rem; color: #aaa; }

    /* 운동 화면 */
    #exercise-screen { padding-top: 80px; justify-content: flex-start; }
    #back-btn {
      align-self: flex-start; background: none; border: 1px solid #444;
      color: white; padding: 8px 16px; border-radius: 8px;
      cursor: pointer; margin-bottom: 16px; font-size: 0.9rem;
    }
    #back-btn:hover { border-color: #00e5ff; color: #00e5ff; }
    #exercise-title { font-size: 1.3rem; margin-bottom: 6px; align-self: flex-start; }
    #status { font-size: 0.9rem; color: #aaa; margin-bottom: 10px; align-self: flex-start; }

    /* 카메라 + 사이드패널 가로 배치 */
    #exercise-body {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      width: 100%;
      max-width: 1000px;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      flex-shrink: 0;
    }
    video, canvas {
      position: absolute; top: 0; left: 0;
      width: 640px; height: 480px; border-radius: 12px;
    }
    video { transform: scaleX(-1); }
    canvas { z-index: 10; }

    /* 사이드 패널 */
    #side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    #feedback-box {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px solid #0f3460;
    }
    .info-box {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #0f3460;
    }
    .info-box .val { font-size: 2rem; font-weight: bold; color: #00e5ff; }
    .info-box .lbl { font-size: 0.8rem; color: #aaa; margin-top: 4px; }

    /* 기록 화면 */
    #record-screen { padding-top: 80px; width: 100%; max-width: 760px; }
    #record-screen h2 { font-size: 1.3rem; margin-bottom: 20px; }
    .chart-box { background: #16213e; border-radius: 16px; padding: 24px; margin-bottom: 20px; width: 100%; }
    .chart-box h3 { font-size: 1rem; margin-bottom: 16px; color: #aaa; }
    .no-record { color: #555; text-align: center; padding: 40px; }
    #clear-btn {
      background: none; border: 1px solid #ff5252; color: #ff5252;
      padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; margin-top: 8px;
    }
    #clear-btn:hover { background: #ff525222; }
  </style>
</head>
<body>

  <div id="nav">
    <div class="logo">🦴 재활 피드백</div>
    <div class="tabs">
      <button id="tab-exercise" onclick="showTab('exercise')" class="active">운동하기</button>
      <button id="tab-record" onclick="showTab('record')">기록 보기</button>
    </div>
  </div>

  <!-- 운동 선택 -->
  <div id="select-screen" class="screen active">
    <h1>🦴 AI 재활 운동 피드백</h1>
    <p>운동을 선택하면 AI가 자세를 실시간으로 분석해드려요</p>
    <div class="exercise-grid">
      <div class="exercise-card" onclick="startExercise('arm-raise')">
        <div class="icon">🙆</div>
        <div class="name">팔 옆으로 들기</div>
        <div class="desc">어깨 외전 운동<br>60~120도 유지</div>
      </div>
      <div class="exercise-card" onclick="startExercise('elbow-flex')">
        <div class="icon">💪</div>
        <div class="name">팔꿈치 굽히기</div>
        <div class="desc">팔꿈치 굴곡 운동<br>60~120도 유지</div>
      </div>
      <div class="exercise-card" onclick="startExercise('squat')">
        <div class="icon">🏋️</div>
        <div class="name">무릎 굽히기</div>
        <div class="desc">하체 재활 운동<br>60~120도 유지</div>
      </div>
    </div>
  </div>

  <!-- 운동 화면 -->
  <div id="exercise-screen" class="screen">
    <button id="back-btn" onclick="goBack()">← 운동 선택으로</button>
    <div id="exercise-title"></div>
    <div id="status">모델 로딩 중...</div>
    <div id="exercise-body">
      <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
      </div>
      <div id="side-panel">
        <div id="feedback-box">운동을 시작해보세요!</div>
        <div class="info-box">
          <div class="val" id="count-display">0</div>
          <div class="lbl">✅ 정확한 자세 횟수</div>
        </div>
        <div class="info-box">
          <div class="val" id="time-display">0s</div>
          <div class="lbl">⏱ 운동 시간</div>
        </div>
        <div class="info-box">
          <div class="val" id="score-display">-</div>
          <div class="lbl">🎯 정확도</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 기록 화면 -->
  <div id="record-screen" class="screen">
    <h2>📊 운동 기록</h2>
    <div id="record-content" style="width:100%"></div>
    <button id="clear-btn" onclick="clearRecords()">기록 초기화</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const feedbackBox = document.getElementById('feedback-box');

    canvas.width = 640;
    canvas.height = 480;

    const CONNECTIONS = [
      [0,1],[0,2],[1,3],[2,4],
      [5,6],[5,7],[7,9],[6,8],[8,10],
      [5,11],[6,12],[11,12],
      [11,13],[13,15],[12,14],[14,16]
    ];

    const EXERCISES = {
      'arm-raise': {
        name: '🙆 팔 옆으로 들기',
        analyze: (kp) => {
          const results = [];
          if ([kp[11],kp[5],kp[7]].every(k=>k.score>0.3)) {
            const angle = calcAngle(kp[11],kp[5],kp[7]);
            results.push({ label:'왼팔', angle, ok: angle>=60&&angle<=120, keypoint:kp[7] });
          }
          if ([kp[12],kp[6],kp[8]].every(k=>k.score>0.3)) {
            const angle = calcAngle(kp[12],kp[6],kp[8]);
            results.push({ label:'오른팔', angle, ok: angle>=60&&angle<=120, keypoint:kp[8] });
          }
          return results;
        },
        okMsg: '✅ 좋은 자세예요!', badMsg: '⚠️ 팔을 더 옆으로 들어주세요!'
      },
      'elbow-flex': {
        name: '💪 팔꿈치 굽히기',
        analyze: (kp) => {
          const results = [];
          if ([kp[5],kp[7],kp[9]].every(k=>k.score>0.3)) {
            const angle = calcAngle(kp[5],kp[7],kp[9]);
            results.push({ label:'왼팔꿈치', angle, ok: angle>=60&&angle<=120, keypoint:kp[7] });
          }
          if ([kp[6],kp[8],kp[10]].every(k=>k.score>0.3)) {
            const angle = calcAngle(kp[6],kp[8],kp[10]);
            results.push({ label:'오른팔꿈치', angle, ok: angle>=60&&angle<=120, keypoint:kp[8] });
          }
          return results;
        },
        okMsg: '✅ 잘 굽혀지고 있어요!', badMsg: '⚠️ 팔꿈치를 더 굽혀주세요!'
      },
      'squat': {
        name: '🏋️ 무릎 굽히기',
        analyze: (kp) => {
          const results = [];
          if ([kp[11],kp[13],kp[15]].every(k=>k.score>0.3)) {
            const angle = calcAngle(kp[11],kp[13],kp[15]);
            results.push({ label:'왼무릎', angle, ok: angle>=60&&angle<=120, keypoint:kp[13] });
          }
          if ([kp[12],kp[14],kp[16]].every(k=>k.score>0.3)) {
            const angle = calcAngle(kp[12],kp[14],kp[16]);
            results.push({ label:'오른무릎', angle, ok: angle>=60&&angle<=120, keypoint:kp[14] });
          }
          return results;
        },
        okMsg: '✅ 좋은 자세예요!', badMsg: '⚠️ 무릎을 더 굽혀주세요!'
      }
    };

    let detector = null;
    let currentExercise = null;
    let currentExerciseKey = null;
    let animFrame = null;
    let goodCount = 0, totalCount = 0;
    let startTime = null, timerInterval = null;
    let lastState = null;

    // 쿨다운 & 유지시간 관련 변수
    let goodStartTime = null;   // 정자세 시작 시각
    let lastCountTime = 0;      // 마지막 카운트 시각
    const HOLD_MS = 800;        // 정자세 유지해야 하는 시간 (0.8초)
    const COOLDOWN_MS = 1500;   // 카운트 후 쉬는 시간 (1.5초)

    function calcAngle(a, b, c) {
      const ab = { x: a.x-b.x, y: a.y-b.y };
      const cb = { x: c.x-b.x, y: c.y-b.y };
      const dot = ab.x*cb.x + ab.y*cb.y;
      const mag = Math.sqrt(ab.x**2+ab.y**2) * Math.sqrt(cb.x**2+cb.y**2);
      return Math.round(Math.acos(Math.max(-1, Math.min(1, dot/mag))) * 180/Math.PI);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showTab(tab) {
      document.getElementById('tab-exercise').classList.toggle('active', tab==='exercise');
      document.getElementById('tab-record').classList.toggle('active', tab==='record');
      if (tab === 'exercise') {
        showScreen('select-screen');
      } else {
        showScreen('record-screen');
        renderRecords();
      }
    }

    async function startExercise(type) {
      currentExerciseKey = type;
      currentExercise = EXERCISES[type];
      goodCount = 0; totalCount = 0; lastState = null;
      document.getElementById('count-display').textContent = '0';
      document.getElementById('score-display').textContent = '-';
      document.getElementById('time-display').textContent = '0s';
      document.getElementById('exercise-title').textContent = currentExercise.name;
      feedbackBox.textContent = '카메라 앞에 서보세요!';
      feedbackBox.style.color = 'white';
      document.getElementById('nav').classList.add('visible');
      showScreen('exercise-screen');

if (!video.srcObject) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          await new Promise((resolve, reject) => {
            video.onloadeddata = resolve;
            setTimeout(() => reject(new Error('카메라 응답 시간 초과')), 10000);
          });
        } catch (err) {
          statusEl.textContent = '❌ 카메라 오류: ' + err.message;
          feedbackBox.textContent = '카메라를 확인해주세요';
          feedbackBox.style.color = '#ff5252';
          return;
        }
      }

      if (!detector) {
        statusEl.textContent = 'AI 모델 로딩 중... (처음엔 10초 정도 걸려요)';
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
        );
      }
      statusEl.textContent = '✅ 준비 완료!';

      startTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('time-display').textContent = sec + 's';
      }, 1000);

      if (animFrame) cancelAnimationFrame(animFrame);
      detectLoop();
    }

    function goBack() {
      if (animFrame) cancelAnimationFrame(animFrame);
      if (timerInterval) clearInterval(timerInterval);
      if (totalCount > 0) saveRecord();
      feedbackBox.textContent = '';
      document.getElementById('nav').classList.remove('visible');
      showScreen('select-screen');
    }

    async function detectLoop() {
      const poses = await detector.estimatePoses(video);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (poses.length > 0) {
        const kp = poses[0].keypoints;
        const analysis = currentExercise.analyze(kp);

        if (analysis.length > 0) {
          const allOk = analysis.every(r => r.ok);
          const now = Date.now();
          const cooldownOver = (now - lastCountTime) > COOLDOWN_MS;

          if (allOk) {
            // 정자세 시작 시각 기록
            if (!goodStartTime) goodStartTime = now;

            const heldLong = (now - goodStartTime) > HOLD_MS;

            if (heldLong && cooldownOver) {
              // 카운트!
              goodCount++;
              lastCountTime = now;
              goodStartTime = null;
              document.getElementById('count-display').textContent = goodCount;
            }

            // 쿨다운 중이면 파란색, 카운트 가능하면 초록색
            if (!cooldownOver) {
              feedbackBox.textContent = '👍 잠깐 유지해보세요...';
              feedbackBox.style.color = '#00b0ff';
            } else if (!heldLong) {
              feedbackBox.textContent = '🔄 조금만 더 유지해요!';
              feedbackBox.style.color = '#ffeb3b';
            } else {
              feedbackBox.textContent = currentExercise.okMsg;
              feedbackBox.style.color = '#00e676';
            }
          } else {
            // 정자세 아닐 때 초기화
            goodStartTime = null;
            feedbackBox.textContent = currentExercise.badMsg;
            feedbackBox.style.color = '#ff5252';
          }

          // 정확도는 운동 시간 대비 정자세 비율로 계산
          const totalSec = Math.max(1, Math.floor((Date.now() - startTime) / 1000));
          const pct = Math.min(100, Math.round((goodCount * 2 / totalSec) * 100));
          document.getElementById('score-display').textContent = pct + '%';
        }

        drawSkeleton(kp, analysis);
      }

      animFrame = requestAnimationFrame(detectLoop);
    }

    function drawSkeleton(keypoints, analysis) {
      ctx.save();
      ctx.scale(-1,1);
      ctx.translate(-canvas.width, 0);
      ctx.lineWidth = 2;
      for (const [i,j] of CONNECTIONS) {
        const a = keypoints[i], b = keypoints[j];
        if (a.score>0.3 && b.score>0.3) {
          ctx.strokeStyle = '#00e5ff';
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
      for (const kp of keypoints) {
        if (kp.score>0.3) {
          ctx.beginPath(); ctx.arc(kp.x,kp.y,5,0,2*Math.PI);
          ctx.fillStyle='#ff4081'; ctx.fill();
        }
      }
      ctx.restore();
      for (const r of analysis) {
        const x = canvas.width - r.keypoint.x;
        const y = r.keypoint.y;
        ctx.fillStyle = r.ok ? '#00e676' : '#ff5252';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`${r.label}: ${r.angle}°`, x+8, y);
      }
    }

    function saveRecord() {
      const sec = Math.floor((Date.now() - startTime) / 1000);
      const pct = totalCount > 0 ? Math.round((goodCount/totalCount)*100) : 0;
      const record = {
        exercise: currentExerciseKey,
        name: currentExercise.name,
        date: new Date().toLocaleDateString('ko-KR'),
        duration: sec, goodCount, accuracy: pct
      };
      const records = JSON.parse(localStorage.getItem('rehab-records') || '[]');
      records.push(record);
      localStorage.setItem('rehab-records', JSON.stringify(records));
    }

    function clearRecords() {
      if (confirm('기록을 모두 삭제할까요?')) {
        localStorage.removeItem('rehab-records');
        renderRecords();
      }
    }

    let chartInstances = {};

    function renderRecords() {
      const records = JSON.parse(localStorage.getItem('rehab-records') || '[]');
      const container = document.getElementById('record-content');
      if (records.length === 0) {
        container.innerHTML = '<div class="no-record">아직 운동 기록이 없어요.<br>운동을 완료하면 여기에 기록이 쌓여요! 💪</div>';
        return;
      }
      const byExercise = {};
      for (const r of records) {
        if (!byExercise[r.exercise]) byExercise[r.exercise] = [];
        byExercise[r.exercise].push(r);
      }
      Object.values(chartInstances).forEach(c => c.destroy());
      chartInstances = {};

      let html = '';
      for (const key of Object.keys(byExercise)) {
        html += `<div class="chart-box"><h3>${byExercise[key][0].name} 정확도 추이</h3><canvas id="chart-${key}"></canvas></div>`;
      }
      container.innerHTML = html;

      for (const key of Object.keys(byExercise)) {
        const data = byExercise[key];
        chartInstances[key] = new Chart(document.getElementById(`chart-${key}`), {
          type: 'line',
          data: {
            labels: data.map((r,i) => `${r.date} (${i+1}회)`),
            datasets: [{
              label: '정확도 (%)',
              data: data.map(r => r.accuracy),
              borderColor: '#00e5ff',
              backgroundColor: 'rgba(0,229,255,0.1)',
              tension: 0.3, fill: true,
              pointBackgroundColor: '#ff4081'
            }]
          },
          options: {
            scales: {
              y: { min:0, max:100, ticks:{color:'#aaa'}, grid:{color:'#333'} },
              x: { ticks:{color:'#aaa'}, grid:{color:'#333'} }
            },
            plugins: { legend: { labels: { color:'#fff' } } }
          }
        });
      }
    }
  </script>
</body>
</html>
