server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 파일 — 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Public reverse proxies may reserve /api. Route API traffic through the
    # frontend container when VITE_API_BASE points to <app-base>/gateway.
    location /gateway/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: React Router 모든 경로 → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 (같은 도메인에서 /api/* 호출)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
